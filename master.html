<body>
<div id="app"></div>
<div class="sync" id="sync"></div>
<button class="gear" id="gear" aria-label="Настройки">⚙︎</button>

<script>
"use strict";
/* ===== настройки ===== */
/* ===== ЗАЩИТА ДАННЫХ: шифрование паролем, смена пароля входа, резервная копия файлом ===== */
const PKC={NAME:"Журнал",APP:"chamsutdinov-bot/Zhurnal-demo",DATA:"chamsutdinov-bot/Zhurnal-demo-data",TK:"uchet_gh_m",ACC:"access.json"};
const PK=(()=>{
  const te=new TextEncoder();
  const b2a=u=>{u=new Uint8Array(u);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
  const a2b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
  const b64e=s=>btoa(unescape(encodeURIComponent(s)));
  const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,""))));
  const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
  const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",te.encode(t)))].map(x=>x.toString(16).padStart(2,"0")).join("");
  const imp=raw=>crypto.subtle.importKey("raw",a2b(raw),"AES-GCM",false,["encrypt","decrypt"]);
  const derive=async(pw,salt,it)=>{const km=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveBits"]);return b2a(await crypto.subtle.deriveBits({name:"PBKDF2",salt:a2b(salt),iterations:it||300000,hash:"SHA-256"},km,256))};
  let keys=[];
  const loadKeys=async()=>{keys=[];for(const n of["pk_dk","pk_dk2"]){const r=ls.get(n);if(r){try{keys.push(await imp(r))}catch(e){}}}};
  const ready=loadKeys();
  const rnd=n=>b2a(crypto.getRandomValues(new Uint8Array(n)));
  async function encWith(k,obj){
    if(!k)return JSON.stringify(obj);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,te.encode(JSON.stringify(obj)));
    return JSON.stringify({enc:1,v:b2a(iv),c:b2a(c)});
  }
  const enc=async obj=>{await ready;return encWith(keys[0],obj)};
  async function dec(txt){
    await ready;let j;try{j=JSON.parse(txt)}catch(e){return{}}
    if(!j||typeof j!=="object")return{};
    if(!j.enc)return j;
    for(const k of keys){try{return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:a2b(j.v)},k,a2b(j.c))))}catch(e){}}
    const er=new Error("badkey");er.bad=true;throw er;
  }
  async function setFromAccess(A,pw){
    if(!A||!A.ds)return;
    const raw=await derive(pw,A.ds,A.i);ls.set("pk_dk",raw);ls.del("pk_dk2");await loadKeys();
  }
  const clear=()=>{ls.del("pk_dk");ls.del("pk_dk2");keys=[]};
  // доступ к файлу доступа (public) с обходом кэша
  async function getAcc(){
    try{const r=await fetch(PKC.ACC+"?t="+Date.now(),{cache:"no-store"});if(r.ok){const j=await r.json();ls.set("pk_acc",JSON.stringify(j));return j}}catch(e){}
    try{return JSON.parse(ls.get("pk_acc")||"null")}catch(e){return null}
  }
  async function mkAccess(token,pw){
    const s=rnd(16),v=rnd(12),ds=rnd(16),it=300000;
    const km=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:a2b(s),iterations:it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt"]);
    const c=await crypto.subtle.encrypt({name:"AES-GCM",iv:a2b(v)},k,te.encode(token));
    return{s,v,i:it,c:b2a(c),ds};
  }
  async function openToken(A,pw){
    try{
      const km=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
      const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:a2b(A.s),iterations:A.i||300000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
      return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:a2b(A.v)},k,a2b(A.c)));
    }catch(e){return null}
  }
  // --- GitHub ---
  const tok=()=>ls.get(PKC.TK)||"";
  const hd=()=>({Authorization:"Bearer "+tok(),Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
  const GHU=(repo,p)=>"https://api.github.com/repos/"+repo+"/contents/"+p;
  async function listCols(){
    const r=await fetch(GHU(PKC.DATA,"data"),{headers:hd(),cache:"no-store"});
    if(r.status===404)return[];if(!r.ok)throw new Error("HTTP "+r.status);
    const a=await r.json();return(Array.isArray(a)?a:[]).filter(x=>/\.json$/.test(x.name)).map(x=>x.name.replace(/\.json$/,""));
  }
  async function getFile(repo,path){
    const r=await fetch(GHU(repo,path),{headers:hd(),cache:"no-store"});
    if(r.status===404)return{txt:null,sha:null};if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();let txt;
    if(j.content&&j.encoding==="base64")txt=b64d(j.content);
    else{const rr=await fetch(GHU(repo,path),{headers:{...hd(),Accept:"application/vnd.github.raw+json"},cache:"no-store"});if(!rr.ok)throw new Error("HTTP "+rr.status);txt=await rr.text()}
    return{txt,sha:j.sha};
  }
  async function putFile(repo,path,txt,sha,msg){
    const body={message:msg||"update",content:b64e(txt)};if(sha)body.sha=sha;
    const r=await fetch(GHU(repo,path),{method:"PUT",headers:{...hd(),"Content-Type":"application/json"},body:JSON.stringify(body),cache:"no-store"});
    if(!r.ok){const er=new Error("HTTP "+r.status);er.status=r.status;throw er}
  }
  const colPath=c=>"data/"+encodeURIComponent(c)+".json";

  // --- смена пароля входа: перешифровываем все данные новым ключом ---
  async function changeEntry(oldPw,newPw,say){

async function load(c,force){
  await PK.ready;const cur=cache[c],h=H();if(cur&&cur.etag&&!force)h["If-None-Match"]=cur.etag;

  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();let txt;
  if(j.content&&j.encoding==="base64")txt=b64d(j.content);
  else{const rr=await tfetch(API+encodeURIComponent(c)+".json",{headers:H({Accept:"application/vnd.github.raw+json"}),cache:"no-store"});txt=await rr.text()}
  let obj={};try{obj=await PK.dec(txt)}catch(e){if(e.bad){const er=new Error("auth");er.auth=true;PK.clear();throw er}}

      const fresh=!i||i.status==="tails";
      ops.push({k:"ms",o,m:{ins:{status:"out",round:fresh?((i&&i.round)||0)+1:((i&&i.round)||1),out:{[m]:{ts:t}}}}});
      if(i&&i.status==="tails")ops.push({k:"ms",o,m:{ins:{conf:null}}});
    }
    push(...ops);V={n:"home"};draw();return;
  }
  if(a==="conf"||a==="tailsgo"){
    const o=a==="conf"?el.dataset.o:V.o,full=a==="conf",note=a==="tailsgo"?($("tn").value||"").trim():"";
    const i=(L.stage[o]||{}).ins||{},conf={...(i.conf||{}),[m]:{ts:Date.now(),full,note}};
    const outs=Object.keys(i.out||{}),ks=outs.length?outs:Object.keys(conf),all=ks.every(x=>conf[x]);
    const status=all?(ks.every(x=>conf[x].full)?"done":"tails"):"out";
    push(evOp({m,ty:"inst_conf",o,full,note}),{k:"ms",o,m:{ins:{conf:{[m]:{ts:Date.now(),full,note}},status}}});
    V=a==="conf"?{n:"home"}:{n:"master",m};draw();return;
  }
  if(a==="rs"){const t=$("tn"),x=el.dataset.t;if(!t.value.includes(x))t.value=(t.value.trim()?t.value.trim()+", ":"")+x;return}
  if(a==="tails"){V={n:"tails",m,o:el.dataset.o};draw();return}
  if(a==="start"){const o=V.o,t=Date.now();push(evOp({m,ty:"start",o}),{k:"ms",o,m:{start:{ts:t,m}}});return}
  if(a==="stage"){const o=V.o,k=el.dataset.k,t=Date.now();
    push(evOp({m,ty:"stage",o,st:k}),{k:"ms",o,m:{stages:{[k]:{ts:t,m}}}});
    if(k==="gotov"){V={n:"master",m};draw()}return}
  if(a==="qstage"){const o=el.dataset.o,k=el.dataset.k,t=Date.now(),st=L.stage[o]||{};
    if(k==="rasp"&&!st.start)push(evOp({m,ty:"start",o}),evOp({m,ty:"stage",o,st:k}),{k:"ms",o,m:{start:{ts:t,m},stages:{[k]:{ts:t,m}}}});
    else push(evOp({m,ty:"stage",o,st:k}),{k:"ms",o,m:{stages:{[k]:{ts:t,m}}}});
    return}
  if(a==="undo"){const o=V.o,k=el.dataset.k;push(evOp({m,ty:"unstage",o,st:k}),{k:"ms",o,m:{stages:{[k]:null}}});return}
}

/* свайп вниз = обновить всё: версия приложения + данные */
const ptr=$("ptr");let pty=null,ppull=0,pbusy=false;
const hidePtr=()=>{ptr.style.transition="";ptr.style.transform="translate(-50%,-70px)";ptr.style.opacity=0};
async function refreshAll(){
  pbusy=true;ptr.style.transition="";ptr.textContent="Обновляю…";ptr.style.transform="translate(-50%,14px)";ptr.style.opacity=1;
  try{
    try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"}),j=await r.json();
      if(j&&j.b&&j.b!==BUILD){ptr.textContent="Новая версия…";location.replace(location.pathname+"?v="+j.b);return}}catch(e){}
    await flush();await pull();draw();
    ptr.textContent=netErr?"Нет связи — данные сохранены":"Обновлено";
  }catch(e){ptr.textContent="Не удалось обновить"}
  setTimeout(()=>{hidePtr();pbusy=false},800);
}
addEventListener("touchstart",e=>{pty=(scrollY<=1&&!pbusy&&!$("ov").innerHTML.trim())?e.touches[0].clientY:null;ppull=0},{passive:true});
addEventListener("touchmove",e=>{
  if(pty==null)return;ppull=Math.max(0,e.touches[0].clientY-pty);
  if(ppull>0){const d=Math.min(ppull*.5,64);ptr.style.transition="none";ptr.textContent=d>=48?"Отпустите для обновления":"Потяните вниз";ptr.style.transform="translate(-50%,"+(d-40)+"px)";ptr.style.opacity=Math.min(1,d/36)}
},{passive:true});
addEventListener("touchend",()=>{if(pty==null)return;const go=ppull*.5>=48;pty=null;ppull=0;if(go)refreshAll();else hidePtr()});
addEventListener("touchcancel",()=>{pty=null;ppull=0;hidePtr()});

/* автообновление: раз в минуту проверяем версию, при новой — тихо перезагружаем */
function autoUpd(){
  if(document.hidden||$("ov").innerHTML.trim()||document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!j.b||j.b===BUILD)return;
    let g="";try{g=sessionStorage.getItem("m_upd")||""}catch(e){}
    const now=Date.now(),[gb,gt]=g.split("|");
    if(gb===j.b&&now-(+gt||0)<300000)return;
    try{sessionStorage.setItem("m_upd",j.b+"|"+now)}catch(e){}
    location.replace(location.pathname+"?v="+j.b);
  }).catch(()=>{});
}
setInterval(autoUpd,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)autoUpd()});
setInterval(()=>{if(!document.hidden&&key()){pull();flush()}},8000);

addEventListener("online",()=>{flush();pull()});

/* ===== вход (один раз на планшете) и настройки ===== */
async function openAccess(A,pw){const t=await openAccess0(A,pw);if(t&&A.ds)await PK.setFromAccess(A,pw);return t}
async function openAccess0(A,pw){
  try{
    const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(A.s),iterations:A.i||300000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(A.v)},k,b(A.c)));
  }catch(e){return null}
}
function login(msg){
  $("ov").innerHTML=`<div class="ov"><div class="box"><h1 style="font-size:32px">Цех · Журнал</h1><div class="hint">Введите пароль доступа. Это нужно один раз на этом планшете.</div><input id="lp" type="password" inputmode="numeric" placeholder="Пароль" autocomplete="off"><div class="err" id="le">${esc(msg||"")}</div><button class="btn a" id="lg">Войти</button></div></div>`;
  const go=async()=>{
    const pw=$("lp").value.trim();if(!pw)return;$("le").textContent="Проверяю…";
    try{
      const ar=await fetch(ACC+"?t="+Date.now(),{cache:"no-store"});const t=await openAccess(await ar.json(),pw);
      if(!t){$("le").textContent="Неверный пароль";return}
      const r=await fetch("https://api.github.com/repos/"+REPO,{headers:{Authorization:"Bearer "+t},cache:"no-store"});
      if(!r.ok){$("le").textContent="Нет доступа к базе ("+r.status+")";return}
      localStorage.setItem(KEYN,t);$("ov").innerHTML="";start();
    }catch(e){$("le").textContent="Нет связи. Проверьте интернет"}
  };
  $("lg").onclick=go;$("lp").onkeydown=e=>{if(e.key==="Enter")go()};
}
async function editHash(){
  try{const r=await load("settings",true),a=r.obj&&r.obj.auth_m;if(a&&a.h){PWH=a.h;PWL=a.l||PWL;try{localStorage.setItem("pk_eh",JSON.stringify([a.h,PWL]))}catch(e){}}}
  catch(e){try{const c=JSON.parse(localStorage.getItem("pk_eh")||"null");if(c){PWH=c[0];PWL=c[1]}}catch(x){}}
}
async function adminPw(){
  await editHash();
  return new Promise(res=>{
    let v="";
    const paint=()=>{$("ov").innerHTML=`<div class="ov"><div class="box"><h1 style="font-size:28px">Пароль управляющего</h1><div class="err" id="ae"></div><div style="font-size:36px;letter-spacing:10px;height:46px">${"•".repeat(v.length)}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,"✕",0,"⌫"].map(k=>`<button class="glass" data-k="${k}">${k}</button>`).join("")}</div><button class="btn glass" id="ac">Отмена</button></div></div>`;
      $("ac").onclick=()=>{$("ov").innerHTML="";res(false)};
      $("ov").querySelectorAll("[data-k]").forEach(b=>b.onclick=async()=>{
        const k=b.dataset.k;if(k==="✕")v="";else if(k==="⌫")v=v.slice(0,-1);else v+=k;
        if(v.length>=PWL&&(await sha(v))===PWH){$("ov").innerHTML="";res(true);return}
        if(v.length>=PWL){paint();$("ae").textContent="Неверный пароль";v="";return}
        paint();
      });
    };
    paint();
  });
}

    const ids=Object.keys(L.staff).sort((a,b)=>(L.staff[a].o||0)-(L.staff[b].o||0));
    $("ov").innerHTML=`<div class="ov"><div class="box" style="width:min(94vw,720px);text-align:left;gap:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h1 style="font-size:28px;margin:0">Мастера</h1><button class="btn a" id="sd" style="padding:10px 22px">Готово</button></div>
    <div class="mg">${ids.map(id=>`<div class="mt"><input data-r="${id}" value="${esc(L.staff[id].n)}"><button class="x" data-del="${id}" title="Удалить">✕</button></div>`).join("")}</div>
    <button class="btn g" id="na">＋ Добавить мастера</button>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn glass" id="cp" style="flex:1 1 100%">Сменить пароль начальника цеха</button><button class="btn glass" id="bk" style="flex:1">Сохранить копию</button><label class="btn glass" style="flex:1;position:relative;text-align:center;cursor:pointer">Загрузить копию<input id="rs" type="file" accept=".json,application/json" style="position:absolute;inset:0;width:100%;height:100%;opacity:0"></label></div></div></div>`;
    $("sd").onclick=()=>{$("ov").innerHTML="";draw()};
    $("na").onclick=addForm;
    $("cp").onclick=async()=>{await editHash();const ok=await PK.form("Пароль начальника цеха","Нужен, чтобы добавлять и удалять мастеров и работать с копией. Только цифры, не меньше 4. Мастерам пароль не нужен.",[["o","Старый пароль",1],["n","Новый пароль",1],["r","Повторите новый пароль",1]],async v=>{
      if((await sha(v.o))!==PWH)throw new Error("Неверный старый пароль");
      if(!/^\d{4,}$/.test(v.n))throw new Error("Новый пароль: только цифры, не меньше 4");

      const h=await sha(v.n),l=v.n.length;await mutate("settings",o=>{o.auth_m={h,l}});PWH=h;PWL=l;try{localStorage.setItem("pk_eh",JSON.stringify([h,l]))}catch(e){}
    });if(ok)await PK.say("Пароль начальника цеха изменён.");paint()};
    $("bk").onclick=async()=>{if(!(await adminPw())){paint();return}PK.backupUI()};
    $("rs").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;if(!(await adminPw())){paint();return}PK.restoreUI(f)};
    $("ov").querySelectorAll("[data-r]").forEach(i=>i.onchange=()=>{const id=i.dataset.r,n=i.value.trim();if(n)push({k:"st",id,d:{...L.staff[id],n}})});
    $("ov").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!(await adminPw())){paint();return}push({k:"st",id:b.dataset.del,d:null});paint()});
  };
  const addForm=()=>{
    $("ov").innerHTML=`<div class="ov"><div class="box" style="width:min(92vw,460px)"><h1 style="font-size:28px">Добавить мастера</h1><input id="nn" placeholder="Имя мастера" autocomplete="off" style="text-align:center;font-size:24px;padding:16px"><button class="btn g" id="ng">Добавить</button><button class="btn glass" id="nc">Отмена</button></div></div>`;
    $("nc").onclick=paint;
    const go=async()=>{const n=$("nn").value.trim();if(!n)return;if(!(await adminPw())){addForm();$("nn").value=n;return}const id=newId();push({k:"st",id,d:{n,o:Date.now()}});paint()};
    $("ng").onclick=go;$("nn").onkeydown=e=>{if(e.key==="Enter")go()};
    setTimeout(()=>{const x=$("nn");x&&x.focus()},50);
  };
  paint();
}
